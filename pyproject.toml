[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "story-teller"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "chatterbox-tts==0.1.7",
  "fastapi==0.162.5",
  "faster-whisper==1.2.1",
  "httpx==0.28.1",
  "python-multipart==0.0.33",
  "setuptools>=80,<81",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["mypy", "pytest", "ruff"]

[project.scripts]
story-teller = "story_teller.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/story_teller"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
